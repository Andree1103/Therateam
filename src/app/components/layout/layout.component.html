<!-- Overlay mobile -->
<div class="overlay-movil" [class.vis]="movilAbierto" (click)="cerrarMovil()"></div>

<!-- Botón hamburguesa (solo mobile) -->
<button class="btn-hamburger" (click)="abrirMovil()" aria-label="Abrir menú">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<div class="shell">

  <!-- ══════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════ -->
  <nav class="nav-sidebar"
       [class.cerrado]="cerrado"
       [class.movil-abierto]="movilAbierto">

    <!-- Brand -->
    <div class="nav-brand">
      <div class="nav-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div class="nav-brand-info">
        <span class="nav-brand-name">Thera Team</span>
        <span class="nav-brand-sub">Gestión Clínica</span>
      </div>
      <!-- Cerrar en mobile -->
      <button class="btn-cerrar-movil" (click)="cerrarMovil()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Botón colapsar (desktop) -->
    <button class="btn-colapsar" (click)="toggleSidebar()" [title]="cerrado ? 'Expandir menú' : 'Colapsar menú'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
        <polyline *ngIf="!cerrado" points="15 18 9 12 15 6"></polyline>
        <polyline *ngIf="cerrado"  points="9 18 15 12 9 6"></polyline>
      </svg>
      <span class="btn-colapsar-txt">Colapsar</span>
    </button>

    <!-- Menú -->
    <div class="nav-menu">

      <div class="nav-section-lbl">Principal</div>

      <div class="nav-item nav-item--dim" title="Próximamente">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-txt">Dashboard</span>
        <span class="nav-pronto">Próx.</span>
      </div>

      <a class="nav-item" routerLink="/citas" routerLinkActive="nav-item--active" (click)="cerrarMovil()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-txt">Citas</span>
      </a>

      <a class="nav-item" routerLink="/pacientes" routerLinkActive="nav-item--active" (click)="cerrarMovil()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-txt">Pacientes</span>
      </a>

      <div class="nav-item nav-item--dim" title="Próximamente">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        <span class="nav-txt">Planes</span>
        <span class="nav-pronto">Próx.</span>
      </div>

      <a class="nav-item" routerLink="/pagos" routerLinkActive="nav-item--active" (click)="cerrarMovil()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span class="nav-txt">Pagos</span>
      </a>

      <div class="nav-section-lbl" style="margin-top:16px">Clínica</div>

      <a class="nav-item" routerLink="/terapeutas" routerLinkActive="nav-item--active" (click)="cerrarMovil()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="nav-txt">Terapeutas</span>
      </a>

      <div class="nav-item nav-item--dim" title="Próximamente">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="nav-txt">Ajustes</span>
        <span class="nav-pronto">Próx.</span>
      </div>

    </div>

    <!-- Usuario / Logout -->
    <div class="nav-user" [class.open]="menuAbierto" (click)="toggleUser($event)">

      <!-- Popup -->
      <div class="user-popup" *ngIf="menuAbierto" (click)="$event.stopPropagation()">
        <div class="popup-user-info">
          <div class="popup-avatar">{{ iniciales }}</div>
          <div class="popup-user-text">
            <div class="popup-name">{{ user?.nombre }} {{ user?.apellido }}</div>
            <div class="popup-email">{{ user?.email }}</div>
          </div>
        </div>
        <hr class="popup-sep">
        <div class="popup-rol">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          {{ rolLabel }}
        </div>
        <button class="popup-logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </div>

      <div class="nav-user-avatar">{{ iniciales }}</div>
      <div class="nav-user-info">
        <span class="nav-user-name">{{ user?.nombre }}</span>
        <span class="nav-user-rol">{{ rolLabel }}</span>
      </div>
      <svg class="nav-user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
        <polyline points="18 15 12 9 6 15"/>
      </svg>

    </div>

  </nav>

  <!-- ══════════════════════════════════════════
       ÁREA DE CONTENIDO
  ══════════════════════════════════════════ -->
  <div class="content-area">
    <router-outlet></router-outlet>
  </div>

</div>
