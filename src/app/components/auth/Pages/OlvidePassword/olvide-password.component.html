<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <span class="login-brand-name">Thera Team</span>
      </div>
      <p>Recuperar contraseña</p>
    </div>

    <ng-container *ngIf="!enviado">
      <p class="text-muted" style="margin-bottom:16px">
        Ingresa tu correo y, si está registrado, te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control"
                 placeholder="tu@correo.com" required>
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || form.invalid">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Enviar enlace</span>
        </button>
      </form>
    </ng-container>

    <div *ngIf="enviado" class="alert" style="background:#dcfce7;color:#15803d;border:1px solid #86efac">
      Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada.
    </div>

    <div class="login-footer">
      <a routerLink="/login" class="text-muted small">← Volver a iniciar sesión</a>
    </div>

  </div>
</div>
