<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <span class="login-brand-name">Thera Team</span>
      </div>
      <p>Restablecer contraseña</p>
    </div>

    <ng-container *ngIf="!exito">
      <form (ngSubmit)="onSubmit()" #form="ngForm" *ngIf="token">
        <div class="form-group">
          <label for="password">Nueva contraseña</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control"
                 placeholder="••••••" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" [(ngModel)]="confirmarPassword" name="confirmar" class="form-control"
                 placeholder="••••••" required>
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || form.invalid">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Restablecer contraseña</span>
        </button>
      </form>

      <div *ngIf="!token" class="alert alert-error">{{ errorMessage }}</div>
    </ng-container>

    <div *ngIf="exito" class="alert" style="background:#dcfce7;color:#15803d;border:1px solid #86efac">
      Contraseña actualizada correctamente. Te llevamos al login...
    </div>

    <div class="login-footer">
      <a routerLink="/login" class="text-muted small">← Volver a iniciar sesión</a>
    </div>

  </div>
</div>
