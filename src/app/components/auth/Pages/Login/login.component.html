<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <span class="login-brand-name">Thera Team</span>
      </div>
      <p>Sistema de Gestión de Citas</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control"
          placeholder="admin&#64;therateam.com"
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control"
          placeholder="••••••"
          required>
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">Iniciar Sesión</span>
      </button>

      <div style="text-align:center;margin-top:14px">
        <!-- <a routerLink="/olvide-password" class="text-muted small">¿Olvidaste tu contraseña?</a> -->
      </div>

    </form>

    <!-- <div class="login-footer">
      <p class="text-muted">Credenciales de prueba:</p>
      <p class="text-muted small">
        Admin: admin&#64;therateam.com / admin123<br>
        Terapeuta: terapeuta&#64;therateam.com / terapeuta123
      </p>
    </div> -->

  </div>
</div>
